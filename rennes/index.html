<!DOCTYPE HTML>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#261A30">
  <meta name="msapplication-navbutton-color" content="#261A30">
  <meta name="apple-mobile-web-app-status-bar-style" content="#261A30">

  <title>Rennes Clicker.</title>
  <meta name="author" content="MonsieurCro">
  <link rel="shortcut icon" type="image/png" href="./assets/favicon.png">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500&display=swap"> -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lobster&display=swap">

  <!-- <link rel="stylesheet" href="./styles.css"> -->
  <style>
    /*Common*/
    * {
      outline: none;
      outline-color: transparent;
      -webkit-tap-highlight-color: rgba(255, 255, 255, 0);
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
      -webkit-box-sizing: border-box;
      -moz-box-sizing: border-box;
      box-sizing: border-box;
      font-family: 'Lobster', sans-serif;
      color: white;
    }
    *:not(input):not(select):not(datalist) {
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      -o-user-select: none;
      user-select: none;
    }
    html {
      width: 100%; height: 100%;
      margin: 0; padding: 0;
      overflow: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      scroll-behavior: smooth;
    }
    html::-webkit-scrollbar {
      width: 0; height: 0;
      display: none;
    }
    body {
      height: 100%; width: 100%;
      margin: 0; padding: 1em;
      background-image: url('./assets/characters_c0d7b.svg'), url('./assets/forest_c5d47.svg');
      background-size: 15em auto, 100% auto;
      background-position: 1.25em bottom, center top;
      background-repeat: no-repeat;
      background-color: #261A30;
    }
    h1, h2, h3, h4, h5, h6, p {
      margin: .5em auto;
    }
    span, a {
      color: inherit;
      font-size: inherit;
      font-weight: inherit;
      font-family: inherit;
    }
    a {
      cursor: pointer;
      text-decoration: none;
      transition: all .3s ease;
    }
    a:hover {
      text-decoration: underline;
    }
    .hidden {
      opacity: 0 !important;
      transition: all .3s ease;
    }
    @media screen and (max-width: 900px){
      html {
        font-size: 2.25vw;
      }
    }
    @media screen and (max-width: 600px){
      html {
        font-size: 3.75vw;
      }
    }
    /*Custom*/
    #start {
      position: fixed;
      z-index: 2;
      top: 0; left: 0; bottom: 0; right: 0;
      width: 100%; height: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: rgba(0, 0, 0, .5);
    }
    #start > * {
      width: auto; height: auto;
      max-width: 75%; max-height: 50%;
      cursor: pointer;
    }
    #start > h1 > img {
      height: .75em;
      opacity: .75;
    }
    #start > h1 > span {
      padding: 0 .25em;
    }
    #counter {
      position: fixed;
      z-index: 1;
      top: 1em; right: 1em; bottom: auto; left: auto;
      padding: .125em .75em;
      background-color: rgb(204, 97, 0);
      border-radius: .175em;
      border-top: .25em solid rgb(179, 85, 0);
      border-bottom: .25em solid rgb(179, 85, 0);
    }
    .renne {
      position: absolute;
      z-index: 4;
      width: auto; height: auto;
      min-width: 2.5em !important; min-height: 2.5em !important;
      max-width: 10em !important; max-height: 10em !important;
      cursor: pointer;
    }
    footer {
      position: fixed;
      z-index: 3;
      left: 0; right: 0; bottom: 1em; top: auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: .75em;
    }
    /*Keyframes*/
    .pulse {
      -webkit-animation: pulse ease-out 2.5s infinite;
      animation: pulse ease-out 2.5s infinite;
    }
    @-webkit-keyframes pulse {
      50% { -webkit-transform: scale(1.05, 1.05); }
      100% { -webkit-transform: scale(1, 1); }
    }
    @keyframes pulse {
      50% { transform: scale(1.05, 1.05); }
      100% { transform: scale(1, 1); }
    }
  </style>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
</head>
<body>
  <div id="start">
    <img class="pulse" src="./assets/logo_d1183.svg" alt="CHASSE AUX RENNES" title="">
    <h1><img src="./assets/fancyline-left.svg" alt="" title=""><span>Démarrer&nbsp;?</span><img src="./assets/fancyline-right.svg" alt="" title=""></h1>
  </div>

  <div id="counter" class="hidden"><span>0</span>&nbsp;pts</div>

  <footer>
    <img src="./assets/fancy-divider.svg" alt="" title="">
    <a href="https://www.dealabs.com/profile/MonsieurCro" target="_blank"><p>MonsieurCro 2021</p></a>
  </footer>

  <!-- <script type="text/javascript">
    if (window.navigator.userAgent.indexOf("MSIE ") > 0 || !!navigator.userAgent.match(/Trident.*rv\:11\./)) {
      document.querySelector(body).innerHTML = 'Sorry, but this browser isn\'t supported.';
    };
  </script> -->
  <!-- <script type="text/javascript" charset="utf-8" src="./scripts.js"></script> -->
  <script type="text/javascript">
    // List our items
    const troupeauRennes = [
      "./assets/chainsaw-level1_6436e.svg",
      "./assets/chainsaw-level2_42719.svg",
      "./assets/clown-level1_75a4d.svg",
      "./assets/clown-level2_0c9f7.svg",
      "./assets/death-level1_a0e67.svg",
      "./assets/death-level2_428ba.svg",
      "./assets/devil-level1_ad24b.svg",
      "./assets/devil-level2_e578f.svg",
      "./assets/mummy-level1_b8043.svg",
      "./assets/mummy-level2_7ba99.svg",
      "./assets/skeleton-level1_cc6b5.svg",
      "./assets/skeleton-level2_f7da1.svg",
      "./assets/vampire-level1_528bf.svg",
      "./assets/vampire-level2_4f880.svg",
      "./assets/witch-level1_7d1d1.svg",
      "./assets/witch-level2_59b65.svg"
    ]

    // Create our counter
    var score = 0;

    // Generate a target
    function nouvelleCible() {
      var renne = {}
      renne.type = troupeauRennes[Math.floor(Math.random() * troupeauRennes.length)];
      renne.taille = Math.floor((Math.random() * 100) + 50);
      renne.posX = Math.floor(Math.random() * ($(document).width() - renne.taille));
      renne.posY = Math.floor(Math.random() * ($(document).height() - renne.taille));
      //console.log(renne);

      $('body').append('<img class="renne" id="renne-' + score + '" src="' + renne.type +'" style="width:' + renne.taille + 'px;left:' + renne.posX + 'px;top:' + renne.posY + 'px;">').fadeIn(500);
    };

    // Target eleminated
    $(document).on('click', '.renne', function(){
      $(this).remove();
      score++;
      $('#counter > span').text(score);
      nouvelleCible();
    });

    // Let's go
    $('#start').click(function() {
      $(this).find('span').html('Bonne&nbsp;chasse&nbsp;!');
      setTimeout(function() {
        $('#start').fadeOut('slow', function() { $(this).remove(); });
        $('#counter').removeClass('hidden');

        // NoOutOfBoundTarget
        $(window).on('resize orientationchange', function() {
          $('#renne-' + score).remove();
          nouvelleCible();
        });

        nouvelleCible();
      }, 2500);
    })
  </script>
</body>
</html>
