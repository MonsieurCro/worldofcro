<!DOCTYPE HTML>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#261A30">
  <meta name="msapplication-navbutton-color" content="#261A30">
  <meta name="apple-mobile-web-app-status-bar-style" content="#261A30">

  <title>Rennes Clicker.</title>
  <meta name="author" content="MonsieurCro">
  <link rel="shortcut icon" type="image/png" href="./assets/favicon.png">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lobster&display=swap">

  <style>
    /*Common*/
    * {
      outline: none;
      outline-color: transparent;
      -webkit-tap-highlight-color: rgba(255, 255, 255, 0);
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
      -webkit-box-sizing: border-box;
      -moz-box-sizing: border-box;
      box-sizing: border-box;
      font-family: 'Lobster', sans-serif;
      color: white;
    }
    *:not(input):not(select):not(datalist) {
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      -o-user-select: none;
      user-select: none;
    }
    html {
      width: 100%; height: 100%;
      margin: 0; padding: 0;
      overflow: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      scroll-behavior: smooth;
    }
    html::-webkit-scrollbar {
      width: 0; height: 0;
      display: none;
    }
    body {
      height: 100%; width: 100%;
      margin: 0; padding: 1em;
      background-image: url('./assets/characters_c0d7b.svg'), url('./assets/forest_c5d47.svg');
      background-size: 15em auto, 100% auto;
      background-position: 1.25em bottom, center top;
      background-repeat: no-repeat;
      background-color: #261A30;
    }
    h1, h2, h3, h4, h5, h6, p {
      margin: .25em auto;
    }
    span, a {
      color: inherit;
      font-size: inherit;
      font-weight: inherit;
      font-family: inherit;
    }
    a {
      cursor: pointer;
      text-decoration: none;
      transition: all .3s ease;
    }
    a:hover {
      text-decoration: underline;
    }
    .hidden {
      opacity: 0 !important;
      z-index: -1 !important;
      transition: all .3s ease;
    }
    @media screen and (max-width: 900px){
      html {
        font-size: 2vw;
      }
    }
    @media screen and (max-width: 600px){
      html {
        font-size: 3.75vw;
      }
    }
    /*Custom*/
    .modal {
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      width: 100%; height: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #start {
      background-color: rgba(0, 0, 0, .5);
      z-index: 3;
      cursor: pointer;
    }
    #start > img {
      width: auto; height: auto;
      max-width: 75%; max-height: 50%;
    }
    h1 > img {
      height: .75em;
      opacity: .75;
    }
    h1 > span {
      padding: 0 .25em;
    }
    #header {
      position: fixed;
      z-index: 2;
      top: 1em; left: 1em; right: 1em; bottom: auto;
      text-align: right;
    }
    #header > .info {
      display: inline-block;
      padding: .125em .75em;
      background-color: #FF7900;
      border-radius: .175em;
      border-top: .25em solid rgb(204, 97, 0);
      border-bottom: .25em solid rgb(204, 97, 0);
    }
    #header > .button {
      float: left;
    }
    .button {
      padding: .375em .75em;
      color: #833DC4; background-color: white;
      border-radius: .175em;
      cursor: pointer;
      transition: all .3s ease;
    }
    .button:hover {
      color: white; background-color: #833DC4;
    }
    .renne {
      position: absolute;
      z-index: 5;
      width: auto; height: auto;
      min-width: 2.5em !important; min-height: 2.5em !important;
      max-width: 10em !important; max-height: 10em !important;
      cursor: pointer;
    }
    #delay {
      background-color: rgba(0, 0, 0, .5);
      z-index: 1;
    }
    #delay > h2 {
      display: inline-block;
      width: 1.5em; height: 1.5em;
      text-align: center; line-height: 1.5em;
      border-radius: 50%;
      font-size: 4.5em;
    }
    #result {
      background-color: rgba(0, 0, 0, .75);
      z-index: 1;
    }
    .card {
      width: 10em; height: 12em;
      color: #833DC4; background-color: white;
      border: .075em solid white;
      border-radius: .175em;
      /*box-shadow: 0 2px 4px 0 rgb(0, 0, 0, .3), inset 0 -4px 16px -12px rgb(0, 0, 0, .5);*/
      overflow: hidden;
      text-align: center;
      margin: 1em auto;
    }
    .card > .content {
      position: relative;
      background-color: #E9EAED;
      /*background: linear-gradient(135deg, #dae7ec, #a0afb4 53%, #dae7ec);*/
      width: 100%; height: calc(100% - 2.15em);
      overflow: hidden;
    }
    .card > .content > img {
      width: auto; height: auto;
      max-width: 75%; max-height: 100%;
      transform: translateY(2.5%);
    }
    .card > .content > .bubble {
      position: absolute;
      top: .5em; left: .5em; bottom: auto; right: auto;
      width: 1.75em; height: 1.75em;
      text-align: center; line-height: 1.75em;
      border-radius: 50%;
      color: white; background-color: #35373B;
      font-size: .85em;
    }
    .card > .text {
      color: #A0AFB4;
      padding: .5em .125em;
      line-height: 1.15em;
    }
    footer {
      position: fixed;
      z-index: 4;
      left: 0; right: 0; bottom: 1em; top: auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: .75em;
    }
    footer > img {
      height: 3.5em;
    }
    /*Keyframes*/
    .grow {
      -webkit-animation: grow ease 2s infinite;
      animation: grow ease 2s infinite;
    }
    @-webkit-keyframes grow {
      50% { -webkit-transform: scale(1.05, 1.05); }
      100% { -webkit-transform: scale(1, 1); }
    }
    @keyframes grow {
      50% { transform: scale(1.05, 1.05); }
      100% { transform: scale(1, 1); }
    }
    .pulse {
      -webkit-animation: pulse ease-in .5s normal;
      animation: pulse ease-in .5s normal;
    }
    @-webkit-keyframes pulse {
      0%, 50% { -webkit-transform: none; }
      20% { -webkit-transform: scale(1.25); }
    }
    @keyframes pulse {
      0%, 50% { transform: none; }
      20% { transform: scale(1.25); }
    }
  </style>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
</head>
<body>
  <nav id="header">
    <div id="mode" class="button hidden">Chargement…</div>
    <div id="timer" class="info hidden"><span>0</span>&nbsp;s</div>
    <div id="score" class="info hidden"><span>0</span>&nbsp;pts</div>
  </nav>

  <div id="start" class="modal">
    <img class="grow" src="./assets/logo_d1183.svg" alt="CHASSE AUX RENNES" title="">
    <h1><img src="./assets/fancyline-left.svg" alt="" title=""><span>Cliquez&nbsp;pour&nbsp;démarrer</span><img src="./assets/fancyline-right.svg" alt="" title=""></h1>
  </div>

  <div id="delay" class="modal hidden"><h2>Chargement…</h2></div>

  <div id="result" class="modal hidden">
    <h1><img src="./assets/fancyline-left.svg" alt="" title=""><span>La&nbsp;chasse est&nbsp;terminée&nbsp;!</span><img src="./assets/fancyline-right.svg" alt="" title=""></h1>

    <div class="card">
      <div class="content">
        <img src="./assets/witch-level2_59b65.svg" alt="" title="">
        <div class="bubble">0</div>
      </div>
      <div class="text">…</div>
    </div>

    <div id="retry" class="button">Réessayer&nbsp;?</div>
  </div>

  <footer>
    <img src="./assets/fancy-divider.svg" alt="" title="">
    <a href="https://www.dealabs.com/profile/MonsieurCro" target="_blank"><p>MonsieurCro&nbsp;2021</p></a>
  </footer>

  <script type="text/javascript">
    // Items
    const troupeauRennes = [
      "./assets/chainsaw-level1_6436e.svg",
      "./assets/chainsaw-level2_42719.svg",
      "./assets/clown-level1_75a4d.svg",
      "./assets/clown-level2_0c9f7.svg",
      "./assets/death-level1_a0e67.svg",
      "./assets/death-level2_428ba.svg",
      "./assets/devil-level1_ad24b.svg",
      "./assets/devil-level2_e578f.svg",
      "./assets/mummy-level1_b8043.svg",
      "./assets/mummy-level2_7ba99.svg",
      "./assets/skeleton-level1_cc6b5.svg",
      "./assets/skeleton-level2_f7da1.svg",
      "./assets/vampire-level1_528bf.svg",
      "./assets/vampire-level2_4f880.svg",
      "./assets/witch-level1_7d1d1.svg",
      "./assets/witch-level2_59b65.svg"
    ];

    // Variables
    var score = 0;
    var timer = 30;
    var challenge = false;
    var delay = 3;
    var loading = null;
    var countdown = null;

    $('#score > span').text(score);
    $('#timer > span').text(timer);
    $('#mode').html(challenge ? 'Zen&nbsp;Mode' : 'Challenge&nbsp;Mode');
    $('#delay > h2').text(delay);

    // Functions
    function updateScore() {
      score++;
      $('#score > span').text(score);
    };
    function resetGame() {
      clearInterval(loading);
      clearInterval(countdown);
      $('.renne').remove();

      score = 0;
      timer = 30;

      $('#score > span').text(score);
      $('#timer').addClass('hidden').children('span').text(timer);
      $('#mode').html(challenge ? 'Zen&nbsp;Mode' : 'Challenge&nbsp;Mode');
      $('#delay').addClass('hidden').children('h2').text(delay).removeClass('pulse');
      $('#result').addClass('hidden');

      // Challenge Mode
      if (challenge) {
        $('#delay').removeClass('hidden');
        $('#delay > h2').addClass('pulse').one('animationend webkitAnimationEnd oAnimationEnd', function() { $(this).removeClass('pulse'); });

        let load = delay;
        loading = setInterval(function() {
          load > 0 ? load-- : 0;

          if (load <= 0) {
            clearInterval(loading);
            $('#delay').addClass('hidden');

            nouvelleCible();
            $('#timer').removeClass('hidden');

            let left = timer;
            countdown = setInterval(function() {
              left > 0 ? left-- : 0;

              if (left <= 0) {
                clearInterval(countdown);
                $('#timer').addClass('hidden');
                $('.renne').remove();
                $('.card > .content > .bubble').text(score);
                $('.card > .content > img').attr('src', troupeauRennes[Math.floor(Math.random() * troupeauRennes.length)]);
                $('.card > .text').html(score == 1 ? 'Renne&nbsp;capturé' : 'Rennes&nbsp;capturés');
                $('#result').removeClass('hidden');
              } else {
                $('#timer > span').text(left);
              }
            }, 1000);
          } else {
            $('#delay > h2').text(load).addClass('pulse').one('animationend webkitAnimationEnd oAnimationEnd', function() { $(this).removeClass('pulse'); });
          };
        }, 1500);
      } else {
        nouvelleCible();
      };
    };

    // GenerateTarget
    function nouvelleCible() {
      let em = parseFloat($('html').css('font-size'));
      let renne = {}

      renne.type = troupeauRennes[Math.floor(Math.random() * troupeauRennes.length)];
      renne.taille = Math.floor((Math.random() * 10 * em) + em);
      renne.taille >= $(document).width() ? $(document).width() / 5 : renne.taille;
      renne.posX = Math.floor(Math.random() * ($(document).width() - renne.taille));
      renne.posY = Math.floor(Math.random() * ($(document).height() - renne.taille));
      renne.posX < 0 ? 0 : renne.posX; renne.posX > $(document).width() ? $(document).width() - (renne.taille / 2) : renne.posX;
      renne.posY < 0 ? 0 : renne.posY; renne.posY > $(document).height() ? $(document).height() - (renne.taille / 2) : renne.posY;

      $('body').append('<img id="renne-' + score + '" class="renne" src="' + renne.type + '" style="width:' + renne.taille + 'px;left:' + renne.posX + 'px;top:' + renne.posY + 'px;">').fadeIn(500);

      // TargetEliminated
      $('#renne-' + score).click(function() {
        $(this).remove();
        updateScore();
        nouvelleCible();
      });
    };

    // Let's go
    $('#start').click(function() {
      $(this).find('span').html('Bonne&nbsp;chasse&nbsp;!');
      setTimeout(function() {
        $('#start').fadeOut('slow', function() {
          $(this).remove();
          $('#mode, #score').removeClass('hidden');
          nouvelleCible();
        });
      }, 1500);
    });
    // Switch mode
    $('#mode').click(function() {
      challenge = !challenge;
      resetGame();
    });
    // Replay
    $('#retry').click(function() {
      resetGame();
    });

    // NoOutOfBoundTarget
    $(window).on('resize orientationchange', function() {
      if ($('.renne').length > 0) {
        $('.renne').remove();
        nouvelleCible();
      };
    });
  </script>
</body>
</html>
