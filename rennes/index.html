<!DOCTYPE HTML>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#261A30">
  <meta name="msapplication-navbutton-color" content="#261A30">
  <meta name="apple-mobile-web-app-status-bar-style" content="#261A30">

  <title>RennesClicker</title>
  <meta name="author" content="MonsieurCro">
  <link rel="shortcut icon" type="image/png" href="./favicon.png">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lobster&display=swap">

  <style>
    @charset "UTF-8";
    /*Common*/
    * {
      outline: none;
      outline-color: transparent;
      -webkit-tap-highlight-color: rgba(255, 255, 255, 0);
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
      -webkit-box-sizing: border-box;
      -moz-box-sizing: border-box;
      box-sizing: border-box;
      font-family: 'Lobster', sans-serif;
      color: #00294E;
    }
    *:not(input):not(select) {
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      -o-user-select: none;
      user-select: none;
    }
    html {
      width: 100%; min-height: 100%;
      margin: 0; padding: 0;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      scroll-behavior: smooth;
    }
    html::-webkit-scrollbar {
      width: 0; height: 0;
      display: none;
    }
    body {
      width: 100%; min-height: 100%;
      margin: 0; padding: 1em 0;
      background-color: #F5F9FC;
      text-align: center;
    }
    h1, h2, h3, h4, h5, h6, p {
      margin: .25em auto; padding: 0 .175em;
      z-index: 1;
    }
    span, a {
      color: inherit;
      font-size: inherit;
      font-weight: inherit;
      font-family: inherit;
    }
    a {
      cursor: pointer;
      text-decoration: none;
      transition: all .3s ease;
    }
    a:hover {
      text-decoration: underline;
    }
    .block {
      margin: 1em auto;
      color: white; background-color: #BF0930;
      text-align: center;
    }
    .container {
      width: 100%; max-width: 1200px;
      margin: auto; padding: .75em 1.5em;
    }
    .card {
      width: 100%; height: 12.5em;
      min-height: 25vh; max-height: 50vh;
      padding: .75em; margin: 1.25em auto;
      border-radius: .25em;
      background-color: #F5F9FC;
      box-shadow: 0 0 .75em rgba(0, 0, 0, .125);
      position: relative;
      z-index: 2;
    }
    .card .visual {
      background-size: auto 80%, cover;
      background-position: center, center top;
      background-repeat: no-repeat;
      position: absolute;
      top: .5em; left: .5em; bottom: .5em; right: .5em;
      width: calc(100% - 1em); height: calc(100% - 1em);
      border-radius: .175em;
      overflow: hidden;
    }
    footer {
      /* position: fixed;
      left: 0; right: 0; bottom: .5em; top: auto; */
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: .75em;
      z-index: 3;
    }
    @media screen and (max-width: 900px){
      html {
        font-size: 1.875vw;
      }
    }
    @media screen and (max-width: 600px){
      html {
        font-size: 3.75vw;
      }
    }
    .fancy {
      position: relative;
      display: inline-block;
    }
    .fancy::before, .fancy::after {
      content: "";
      position: absolute;
      top: 5%; bottom: 5%;
      height: 90%; width: 2em;
      background-size: contain;
      background-position-y: center;
      background-repeat: no-repeat;
      opacity: .75;
    }
    .fancy::before {
      right: 100%; left: auto;
      background-position-x: right;
      background-image: url('./christmas2021/assets/fancyline-left.svg');
    }
    .fancy::after {
      left: 100%; right: auto;
      background-position-x: left;
      background-image: url('./christmas2021/assets/fancyline-right.svg');
    }
    .separator {
      width: 100%; height: 3.5em;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      background-image: url('./christmas2021/assets/fancy-divider.svg');
}
    #snow {
      position: fixed;
      height: 104vh; width: 104vw;
      top: -2vh; left: -2vw; right: -2vw; bottom: -2vh;
      overflow: hidden;
      /*z-index: -1;*/
    }
  </style>
</head>
<body>
  <h1 class="fancy">RennesClicker</h1>

  <div class="block">
    <div class="container">
      <a href="./summer2022/" target="_self">
        <div class="card" id="summer2022">
          <div class="visual" style="background-image:url('./summer2022/assets/logo_13260.svg'),url('./summer2022/assets/forest_54b2d.svg');"></div>
          <!-- <p>Christmas&nbsp;2021</p> -->
        </div>
      </a>
      <a href="./christmas2021/" target="_self">
        <div class="card" id="christmas2021">
          <div class="visual" style="background-image:url('./christmas2021/assets/logo_d007f.svg'),url('./christmas2021/assets/forest_eebbf.svg');"></div>
          <!-- <p>Christmas&nbsp;2021</p> -->
        </div>
      </a>
      <a href="./halloween2021/" target="_self">
        <div class="card" id="halloween2021">
          <div class="visual" style="background-image:url('./halloween2021/assets/logo_d1183.svg'),url('./halloween2021/assets/forest_c5d47.svg');"></div>
          <!-- <p>Halloween&nbsp;2021</p> -->
        </div>
      </a>
    </div>
  </div>

  <footer>
    <div class="separator"></div>
    <a href="https://www.dealabs.com/profile/MonsieurCro" target="_blank"><p>MonsieurCro&nbsp;2021 -&nbsp;2022</p></a>
  </footer>

  <canvas id="snow"></canvas>
  <script type="text/javascript" src="./snow.js"></script>
</body>
</html>
